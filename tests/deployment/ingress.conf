# Executed by test_compose.py with a disposable CA and two canonical HTTPS origins.
pid /tmp/nginx.pid;
events {}
http {
    access_log off;
    ssl_certificate /tls/cert.pem;
    ssl_certificate_key /tls/key.pem;
    server {
        listen 443 ssl;
        server_name storage.publisher.test;
        client_max_body_size 0;
        location / {
            proxy_pass http://seaweedfs:8333;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
    server {
        listen 443 ssl;
        server_name assets.publisher.test;
        location / {
            proxy_pass http://assets:8080;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }
    }
}
