pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript text/javascript application/wasm;
    map "$status:$uri" $guavajam_cache_control {
        default "no-cache";
        "~^(200|206|304):/(.*/)?(index|work)\.[0-9a-f]{64}\.sqlite\.gz$" "public, max-age=31536000, immutable";
    }
    access_log off;
    error_log /dev/stderr warn;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_tokens off;
        root /srv/guavajam/site/current;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control $guavajam_cache_control always;
        location = /healthz { access_log off; try_files /index.html =503; }
        location ~ (^|/)\. { return 404; }
        location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; }
        location ~ \.atom$ { default_type application/atom+xml; try_files $uri =404; }
        location ~ \.wasm$ { default_type application/wasm; try_files $uri =404; }
        location / { try_files $uri $uri/ =404; }
    }
}
