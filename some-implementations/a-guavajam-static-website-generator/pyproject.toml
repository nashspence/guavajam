[project]
name = "a-guavajam-static-website-generator"
version = "0.1.0"
description = "Static websites from independently verified GuavaJam works"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "REUSE.toml", "src/a_guavajam_static_website_generator/assets/lucide-LICENSE.txt", "src/a_guavajam_static_website_generator/assets/fflate-LICENSE.txt", "LICENSES/MIT.txt"]
requires-python = ">=3.12,<3.13"
dependencies = ["guavajam==0.1.0"]

[project.scripts]
a-guavajam-static-website-generator = "a_guavajam_static_website_generator.renderer:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
a_guavajam_static_website_generator = ["templates/*.yml", "styles/*.css", "assets/*.js", "assets/*.mjs", "assets/*.wasm", "assets/*.txt", "assets/*.json", "assets/*.license"]

[tool.uv.sources]
guavajam = { workspace = true }

[dependency-groups]
dev = ["PyMuPDF==1.26.5"]
