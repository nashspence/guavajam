name: Prepare verified edition

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed full 40-character commit SHA with passing source CI
        type: string
        required: true
      edition_tag:
        description: Intended works/<slug>/vMAJOR.MINOR.PATCH tag
        type: string
        required: true
      publish:
        description: Publish a reviewed proof from a successful staging run
        type: boolean
        default: false
      proof_source:
        description: Publication proof source (saved uses a temporary draft holding the retained files)
        type: choice
        options: [staging, rebuild, saved]
        default: staging
      staged_run_id:
        description: Staging run ID (required for publication)
        type: string
      provenance_sha256:
        description: SHA-256 of the reviewed provenance.json (required for publication)
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && false && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.12.1
      - name: Require successful source and builder checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import os, re, sys
          sys.path.insert(0, "scripts")
          from pathlib import Path
          from check_editorial_history import require_compatible_workflows
          from publish_edition import require_source_check
          commit = os.environ["SOURCE_COMMIT"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Expected full commit SHA")
          require_compatible_workflows(Path.cwd(), commit)
          for sha in dict.fromkeys([commit, os.environ["GITHUB_SHA"]]):
              require_source_check(os.environ["GITHUB_REPOSITORY"], sha)
          PY
      - name: Build and verify canonical edition
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDITION_TAG: ${{ inputs.edition_tag }}
        run: |
          python scripts/build_edition.py --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG" --output dist/edition
          python scripts/verify_edition.py dist/edition --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG"
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install: false
      - name: Install pinned candidate qualification tools
        run: |
          mise install node
          node_bin="$(mise where node)/bin"
          export PATH="$node_bin:$PATH"
          printf '%s\n' "$node_bin" >> "$GITHUB_PATH"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: PyMuPDF==1.26.5
      - name: Qualify the exact staged candidate
        run: python scripts/qualify_edition.py dist/edition --output dist/qualification
      - name: Retain candidate qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edition-qualification
          path: dist/qualification/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-edition
          path: dist/edition/
          if-no-files-found: error
          retention-days: 90

      - name: Prepare the registration and release notes for editorial review
        run: |
          mkdir -p dist/review
          python scripts/issuance.py prepare dist/edition --staged-run-id "$GITHUB_RUN_ID" > dist/review/authorization.json
          python scripts/editorial_notices.py --initial dist/edition > dist/review/release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edition-review
          path: dist/review/
          if-no-files-found: error
          retention-days: 90

      - name: Record proof for editorial review
        run: |
          digest=$(sha256sum dist/edition/provenance.json | cut -d ' ' -f 1)
          printf 'Staging run ID: `%s`\n\nReviewed file: `provenance.json`\n\nSHA-256: `%s`\n\nCandidate qualification: passed for these exact bytes. Review `edition-qualification/report.json`, screen proofs and A4/Letter PDFs.\n' "$GITHUB_RUN_ID" "$digest" >> "$GITHUB_STEP_SUMMARY"

  recover:
    if: github.ref == 'refs/heads/main' && false && inputs.publish && inputs.proof_source == 'rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      STAGED_RUN_ID: ${{ inputs.staged_run_id }}
      PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      EDITION_TAG: ${{ inputs.edition_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare current verification tools
        run: |
          python3 -m venv "$RUNNER_TEMP/proof-verifier"
          "$RUNNER_TEMP/proof-verifier/bin/pip" install --no-deps --only-binary=:all: -r requirements-ci.txt
      - name: Locate original builder and tool versions
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          builder=$("$RUNNER_TEMP/proof-verifier/bin/python" scripts/reviewed_artifact.py builder "$STAGED_RUN_ID" "$PROVENANCE_SHA256")
          git merge-base --is-ancestor "$builder" HEAD
          git worktree add --detach original-builder "$builder"
          python3 - <<'PY'
          import os, re, tomllib
          with open("original-builder/mise.toml", "rb") as config:
              pins = tomllib.load(config)["tools"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for tool in ("python", "pandoc"):
                  if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", pins[tool]):
                      raise SystemExit(f"expected exact original {tool} version")
                  print(f"{tool}={pins[tool]}", file=output)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.original.outputs.python }}
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: ${{ steps.original.outputs.pandoc }}
      - name: Rebuild archived bytes with the original toolchain
        run: |
          python -m pip install --no-deps --only-binary=:all: -r original-builder/requirements-ci.txt
          python original-builder/scripts/build_edition.py --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG" --output "$GITHUB_WORKSPACE/dist/edition"
      - name: Verify the rebuilt proof against the reviewed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/proof-verifier/bin/python" scripts/reviewed_artifact.py verify "$STAGED_RUN_ID" "$PROVENANCE_SHA256" dist/edition
          "$RUNNER_TEMP/proof-verifier/bin/python" scripts/verify_edition.py dist/edition --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovered-edition
          overwrite: true
          path: dist/edition/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: recover
    if: >-
      ${{ !cancelled() && false && github.ref == 'refs/heads/main' && inputs.publish &&
          (inputs.proof_source == 'rebuild' && needs.recover.result == 'success' ||
           inputs.proof_source != 'rebuild' && needs.recover.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: press-release
    concurrency:
      group: press-edition
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - name: Download explicitly recovered proof
        if: inputs.proof_source == 'rebuild'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovered-edition
          path: dist/edition
      - name: Check the reviewed proof on the publication runner
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
          PROVENANCE_SHA256: ${{ inputs.provenance_sha256 }}
          PROOF_SOURCE: ${{ inputs.proof_source }}
          EDITION_TAG: ${{ inputs.edition_tag }}
        run: |
          case "$PROOF_SOURCE" in
            staging) command=(download) ;;
            rebuild) command=(verify) ;;
            saved) command=(restore --tag "$EDITION_TAG") ;;
            *) exit 1 ;;
          esac
          python scripts/reviewed_artifact.py "${command[@]}" "$STAGED_RUN_ID" "$PROVENANCE_SHA256" dist/edition
      - name: Check the staged presentation profile
        run: |
          python scripts/check_profile_history.py --candidate dist/edition/provenance.json
      - name: Create a repository-scoped read-only policy token
        id: policy-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PRESS_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRESS_POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
      - name: Promote the verified draft with a live immutability check
        env:
          GH_TOKEN: ${{ github.token }}
          PRESS_POLICY_READ_TOKEN: ${{ steps.policy-token.outputs.token }}
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EDITION_TAG: ${{ inputs.edition_tag }}
          PROOF_SOURCE: ${{ inputs.proof_source }}
        run: |
          flags=()
          if [[ "$PROOF_SOURCE" == saved ]]; then flags+=(--saved-proof); fi
          python scripts/publish_edition.py --directory dist/edition --commit "$SOURCE_COMMIT" --tag "$EDITION_TAG" --issuer-commit "$GITHUB_SHA" --staged-run-id "$STAGED_RUN_ID" "${flags[@]}"
      - name: Prepare the verified publication receipt
        env:
          EDITION_TAG: ${{ inputs.edition_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          edition_path=${EDITION_TAG#works/}
          registration="registrations/editions/$edition_path.json"
          page_dir="records/editions/$edition_path"
          python scripts/issuance.py receipt dist/edition > "$RUNNER_TEMP/registration.json"
          # Change only this ephemeral checkout to render the committed projection.
          cp "$RUNNER_TEMP/registration.json" "$registration"
          python scripts/public_record.py --write "$EDITION_TAG" --directory dist/edition
          mkdir -p dist/receipt
          cp --parents "$registration" "$page_dir/index.html" "$page_dir/provenance.json" \
            "records/works/${edition_path%/*}/index.html" dist/receipt/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edition-receipt
          path: dist/receipt/
          if-no-files-found: error
          retention-days: 90
