name: Confirm edition absence

on:
  workflow_dispatch:
    inputs:
      edition_tag:
        description: Unclaimed reservation or stopped claim whose absence should be confirmed
        required: true
        type: string

permissions: {}

jobs:
  confirm:
    name: Confirm ${{ inputs.edition_tag }}
    if: github.ref == 'refs/heads/main' && false
    environment: press-release
    # The absence check must run after any promotion already past its last main-tip check.
    concurrency:
      group: press-edition
      cancel-in-progress: false
    permissions:
      # GitHub lists unpublished drafts only for callers with push access.
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - name: Verify release and tag absence
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_TAG: ${{ inputs.edition_tag }}
        run: python scripts/abandon_edition.py -- "$EDITION_TAG"
