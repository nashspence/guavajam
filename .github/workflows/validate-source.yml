name: Validate sources

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Validate manuscript sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install: false

      - name: Install the authoring toolchain
        run: make setup

      - name: Verify incoming publication signatures using independent publisher policy
        env:
          PRESS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRESS_PUBLISHER_GPG_FINGERPRINTS: ${{ vars.PRESS_PUBLISHER_GPG_FINGERPRINTS }}
          PRESS_PUBLISHER_GPG_PUBLIC_KEYS: ${{ vars.PRESS_PUBLISHER_GPG_PUBLIC_KEYS }}
          PRESS_PUBLISHER_SSH_SIGNERS: ${{ vars.PRESS_PUBLISHER_SSH_SIGNERS }}
        run: .venv/bin/python scripts/check_publications.py --offline

      - name: Run executable tests
        run: make test

      - name: Install pinned browser regression tools
        run: |
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium firefox webkit

      - name: Verify real capture extension imports
        run: make test-browser

      - name: Enforce source format on the tracked tree
        run: make check-source

  assets:
    name: Verify manuscript assets
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements-ci.txt
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.12.1
      - name: Download, hash and inspect every referenced approved asset
        env:
          PRESS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRESS_PUBLISHER_GPG_FINGERPRINTS: ${{ vars.PRESS_PUBLISHER_GPG_FINGERPRINTS }}
          PRESS_PUBLISHER_GPG_PUBLIC_KEYS: ${{ vars.PRESS_PUBLISHER_GPG_PUBLIC_KEYS }}
          PRESS_PUBLISHER_SSH_SIGNERS: ${{ vars.PRESS_PUBLISHER_SSH_SIGNERS }}
        run: |
          make check-assets PYTHON=python
          python scripts/check_publications.py
