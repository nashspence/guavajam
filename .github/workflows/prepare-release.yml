name: Prepare distribution artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact coordinated version already committed in project metadata
        required: true
        type: string
      package:
        description: Distribution to prepare; no tag, release or registry publication is created
        required: true
        type: choice
        options: [all, guavajam, a-guavajam-static-website-generator, a-chatgpt-conversation-archive-gfm-extractor, a-chatgpt-conversation-archiver-browser-extension]
        default: all

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.0
          install: false
      - run: mise install
      - name: Install artifact qualification tools
        run: mise exec -- uv sync --locked --all-packages --group dev
      - name: Build and verify selected distributions
        env:
          PACKAGE: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: mise exec -- .venv/bin/python tools/prepare_artifacts.py --package "$PACKAGE" --version "$EXPECTED_VERSION" --output prepared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guavajam-${{ inputs.package }}-${{ inputs.version }}
          path: prepared/
          if-no-files-found: error
