name: Verify portable renderer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: 3.12.1
      - name: Verify pinned parser
        run: pandoc --version | head -1 | grep -Fx 'pandoc 3.12.1'
      - name: Exercise independent Git and cryptographic publisher fixtures
        run: python -m unittest discover -s tests -v
      - name: Verify Python syntax
        run: python -m compileall -q guavajam tests
