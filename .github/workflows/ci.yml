name: Verify packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: Verify ${{ matrix.package }} distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [guavajam, a-guavajam-static-website-generator, a-chatgpt-conversation-archive-gfm-extractor]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.0
          install: false
      - run: mise install
      - name: Install only this package and its dependencies
        run: |
          mise exec -- uv sync --locked --package "${{ matrix.package }}" --group dev
      - name: Enforce repository documentation policy
        run: make test-repository PYTHON=.venv/bin/python
      - name: Enforce package boundaries
        run: .venv/bin/python tools/check_boundaries.py
      - name: Verify coordinated versions
        run: .venv/bin/python tools/version.py
      - name: Run package contracts
        run: mise exec -- make test-${{ matrix.package }} PYTHON=.venv/bin/python
      - name: Build wheel and standalone source distribution
        run: |
          mise exec -- uv build --package guavajam
          if [ "${{ matrix.package }}" != guavajam ]; then
            mise exec -- uv build --package "${{ matrix.package }}"
          fi
      - name: Verify isolated installed artifacts
        run: mise exec -- .venv/bin/python tools/check_artifacts.py --package ${{ matrix.package }}
      - name: Install browser qualification tools
        if: matrix.package == 'a-guavajam-static-website-generator'
        run: |
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium firefox webkit
      - name: Qualify rendering, catalog, native playback, accessibility and print
        if: matrix.package == 'a-guavajam-static-website-generator'
        run: mise exec -- make test-browser PYTHON=.venv/bin/python
      - name: Verify Python syntax
        run: .venv/bin/python -c 'from pathlib import Path; import sys; sys.path.insert(0, str(Path("tools").resolve())); from workspace import PROJECTS; import compileall; assert compileall.compile_dir(PROJECTS["${{ matrix.package }}"] / "src", quiet=1)'

  compose:
    name: Verify Compose and local S3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.0
          install: false
      - run: mise install
      - run: mise exec -- uv sync --locked --all-packages --group dev
      - run: make test-compose

  licensing:
    name: Verify REUSE licensing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.0
          install: false
      - run: mise install
      - run: make check-licenses

  archiver:
    name: Verify ChatGPT archiver distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.0
          install: false
      - run: mise install
      - run: make test-a-chatgpt-conversation-archiver-browser-extension PYTHON='mise exec -- python'
      - run: |
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium
      - run: make test-archiver-browser PYTHON='mise exec -- python'

  archive_handoff:
    name: Verify ChatGPT archive-to-GFM handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.0
          install: false
      - run: mise install
      - run: |
          mise exec -- uv sync --locked --package a-chatgpt-conversation-archive-gfm-extractor --no-dev
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium
      - run: mise exec -- make test-chatgpt-handoff PYTHON=.venv/bin/python
