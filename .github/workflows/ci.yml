name: Verify packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: Verify ${{ matrix.package }} distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [core, view]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
        with:
          version: 2026.11.0
          install: false
      - run: mise install
      - name: Install only this package and its dependencies
        run: |
          if [ "${{ matrix.package }}" = core ]; then
            mise exec -- uv sync --locked --package guavajam-core --no-dev
          else
            mise exec -- uv sync --locked --all-packages --group dev
          fi
      - name: Enforce package boundaries
        run: .venv/bin/python tools/check_boundaries.py
      - name: Verify coordinated versions
        run: .venv/bin/python tools/version.py
      - name: Run package contracts
        run: mise exec -- make test-${{ matrix.package }} PYTHON=.venv/bin/python
      - name: Build wheel and standalone source distribution
        run: |
          mise exec -- uv build --package guavajam-core
          if [ "${{ matrix.package }}" = view ]; then
            mise exec -- uv build --package guavajam-view
          fi
      - name: Verify isolated installed artifacts
        run: mise exec -- .venv/bin/python tools/check_artifacts.py --package ${{ matrix.package }}
      - name: Install browser qualification tools
        run: |
          mise exec -- npm ci --ignore-scripts
          mise exec -- npx playwright install --with-deps chromium firefox webkit
      - name: Qualify capture extension and importer
        if: matrix.package == 'core'
        run: mise exec -- make test-capture-browser PYTHON=.venv/bin/python
      - name: Qualify rendering, catalog, native playback, accessibility and print
        if: matrix.package == 'view'
        run: mise exec -- make test-browser PYTHON=.venv/bin/python
      - name: Verify Python syntax
        run: .venv/bin/python -m compileall -q projects/${{ matrix.package }}
